rslidar_pointcloud_to_scan:
  ros__parameters:
    use_sim_time: false

    # Empty means keep the cloud frame. For Nav2 on the real robot, prefer base_link
    # after base_link -> lidar_link TF is correct.
    target_frame: base_link
    transform_tolerance: 0.05

    # Tune these after checking the real lidar installation height and pitch.
    min_height: -0.30
    max_height: 0.30

    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.0034906585
    scan_time: 0.10

    range_min: 0.20
    range_max: 30.0
    use_inf: true
