# =============================================================================
# slam_toolbox.yaml
# 所属模块：slam_toolbox 节点（激光 SLAM 建图与定位）
# 用途：订阅 /scan 激光数据 + /odom 里程计 + TF，在 map 坐标系下增量式建图，
#       建图完成保存的地图供 Nav2 map_server 加载。
# 话题流：/scan (LaserScan) + /odom -> 本节点 -> /map (OccupancyGrid)
# =============================================================================
slam_toolbox:                      # 节点名
  ros__parameters:                 # ROS2 参数命名空间固定层级
    # 是否使用仿真时间（/clock）。true = 仿真/回放 bag 建图
    use_sim_time: true
    mode: mapping                  # 运行模式：mapping=建图；localization=仅定位
    odom_frame: odom               # 里程计坐标系（TF 树中位于 base_link 之上）
    map_frame: map                 # 地图坐标系（全局固定系）
    base_frame: base_link          # 机器人本体坐标系
    scan_topic: /scan              # 输入激光扫描话题

    map_update_interval: 2.0       # 地图更新发布间隔（秒）
    resolution: 0.05               # 地图分辨率（米/格），0.05m 即每格 5cm
    max_laser_range: 16.0          # 激光最大有效距离（米），超过不参与匹配
    minimum_time_interval: 0.05    # 允许更高扫描处理频率，避免输入队列堆积
    transform_timeout: 0.2         # TF 变换等待超时（秒）
    tf_buffer_duration: 30.0       # TF 缓冲时长（秒），回放 bag 时需较大缓冲
    stack_size_to_use: 40000000    # 线程栈大小（字节），SLAM 递归计算需要大栈
    enable_interactive_mode: true  # 是否允许 RViz 交互式调整机器人位姿（手动纠偏）

    use_scan_matching: true        # 是否启用激光帧间匹配（核心建图算法）
    use_scan_barycenter: true      # 使用扫描重心参与匹配，提高精度
    minimum_travel_distance: 0.15  # 最小移动距离（米），小于该值不触发帧匹配
    minimum_travel_heading: 0.15   # 最小旋转角度（弧度），小于该值不触发帧匹配
    scan_queue_size: 100           # ROS 扫描订阅队列，仿真高频输入时避免丢帧
    scan_buffer_size: 40           # 扫描缓存帧数，用于后续回环检测
    scan_buffer_maximum_scan_distance: 16.0  # 缓存中扫描的最大匹配距离（米）
    link_match_minimum_response_fine: 0.1    # 相邻帧精细匹配的最低响应阈值
    link_scan_maximum_distance: 1.5          # 相邻帧之间允许的最大距离（米）
    loop_search_maximum_distance: 3.0        # 回环搜索的最大距离（米）
    do_loop_closing: true          # 是否启用回环闭合（消除累积漂移）
    loop_match_minimum_chain_size: 10        # 回环匹配所需最小链长（帧数）
    loop_match_maximum_variance_coarse: 3.0  # 粗匹配允许的最大方差
    loop_match_minimum_response_coarse: 0.35 # 粗匹配最低响应阈值
    loop_match_minimum_response_fine: 0.45   # 精匹配最低响应阈值
