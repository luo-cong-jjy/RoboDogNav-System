m20_grid_lidar_simulator:
  ros__parameters:
    map_topic: /map
    odom_topic: /odom
    scan_topic: /scan
    scan_frame: base_scan
    publish_rate_hz: 10.0
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.017453292519943295
    range_min: 0.05
    range_max: 20.0
    occupied_threshold: 50
    step_fraction: 2.0
    # Preserve the MuJoCo validation world timing from 2026-09-01 09:32.
    dynamic_speed_scale: 0.35
