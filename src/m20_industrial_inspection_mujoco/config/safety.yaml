# MuJoCo 底层控制安全限速。
#
# 预留给 Gazebo/Nav2 的集成入口是 /m20_nav2/cmd_vel。
# 集成时请把 Nav2 controller 输出的 /cmd_vel remap 到 /m20_nav2/cmd_vel，
# 不要让 Nav2 直接占用官方 sdk_deploy 订阅的 /cmd_vel。
cmd_vel_safety_mux:
  ros__parameters:
    upstream_cmd_topic: /m20_nav2/cmd_vel
    manual_cmd_topic: /m20_control/cmd_vel_manual
    e_stop_topic: /m20_control/e_stop
    safe_cmd_topic: /m20_control/cmd_vel_safe
    command_timeout_sec: 0.5
    publish_rate_hz: 20.0
    max_linear_x: 0.45
    max_linear_y: 0.2
    max_angular_z: 0.65
    max_linear_accel: 1.2
    max_angular_accel: 1.4
    manual_priority: true
