m20_grid_route_planner:
  ros__parameters:
    occupancy_topic: /m20/map/active_occupancy
    odom_topic: /m20/sim/body_pose
    goal_topic: /m20/navigation/goal_pose
    route_topic: /m20/navigation/global_route
    scan_goal_topic: /m20/navigation/scan_goal
    route_state_topic: /m20/navigation/global_route_state
    segment_hold_topic: /m20/control/route_segment_hold
    inflation_radius: 0.60
    # This is a preference, not a second occupied layer. A* may still use a
    # genuinely narrow free corridor, but in open space it pays a quadratic
    # cost within 0.20 m of the hard inflation boundary. Path simplification
    # and SCAN subgoal compression preserve the same preferred corridor.
    soft_clearance_margin: 0.20
    soft_clearance_weight: 4.0
    # Both 40 m maps end at x=0, but the physical flat approximation continues
    # through the reserved 4 m shared doorway.  Keep normal boundary inflation
    # everywhere else and remove only its artificial padding inside this gate.
    shared_gateway_x: 0.0
    shared_gateway_center_y: 0.0
    shared_gateway_width: 4.0
    nearest_free_radius: 1.50
    waypoint_spacing: 0.90
    subgoal_acceptance_radius: 0.30
    # Keep this aligned with SCAN's 0.20 m target tolerance.  Otherwise SCAN
    # can legitimately stop while the route adapter still waits and times out.
    final_acceptance_radius: 0.20
    # SCAN retains its vendor dynamic limits.  Short logical bend points are
    # extended only along the same inflated-free line for feasible timing.
    minimum_scan_goal_distance: 0.85
    subgoal_stall_timeout_sec: 10.0
    subgoal_min_progress_m: 0.05
    # Unsafe compressed bends remain stop-to-stop.  Shallow bends may hand
    # off early only when a 0.54 m rolling-radius fillet fits and the entire
    # shortcut keeps another 0.10 m outside the already inflated 0.60 m hard
    # grid. The 0.893 m outer sweep remains a turn-space diagnostic, not an
    # additional circular obstacle inflation radius.
    continuous_handoff_enabled: true
    continuous_handoff_radius: 0.55
    continuous_handoff_distance: 0.70
    continuous_max_heading_change: 0.70
    continuous_minimum_turn_radius: 0.54
    continuous_minimum_extra_clearance: 0.10
    intermediate_stop_linear_speed: 0.04
    intermediate_stop_angular_speed: 0.08
    intermediate_stop_stable_sec: 0.30
    intermediate_stop_timeout_sec: 6.0
    # Publish the next SCAN target while execution is frozen, then leave time
    # for its trajectory callback to arrive before the safety layer releases.
    segment_hold_release_delay_sec: 0.20
    # The validated M20 policy has no stable zero-radius yaw.  When a fallback
    # begins at a boundary with a large heading change, first back straight
    # into open space, then execute the normal inflated-grid route.
    reverse_escape_enabled: true
    reverse_escape_trigger_angle: 1.00
    reverse_escape_alignment_angle: 0.35
    reverse_escape_min_distance: 0.90
    reverse_escape_max_distance: 1.20
    reverse_escape_sample_step: 0.10
    occupied_threshold: 50
