scan_planner_node:
  ros__parameters:
    # Match the independent 0.30 m guard envelope. At SCAN's 0.05 m grid,
    # any value above 0.30 m occupies the next cell and closes the validated
    # 0.90 m passage, so residual margin must come from tracking control.
    grid_map.double_cylinder_radius: 0.30
    # Keep the original 0.45 m per-side nominal envelope after moving 0.05 m
    # from the soft optimizer term into the hard planning footprint.
    optimization.dist0: 0.15

m20_grid_route_planner:
  ros__parameters:
    inflation_radius: 0.45

m20_collision_guard:
  ros__parameters:
    footprint_radius: 0.25
    footprint_offset: 0.18
    safety_margin: 0.05
    # The measured worst MuJoCo stop travel is 0.156 m. At the 0.45 m/s
    # command limit this 0.70 s horizon still previews 0.315 m, while
    # avoiding the one-second constant-turn extrapolation deadlock around
    # isolated obstacle corners.
    lookahead_sec: 0.70
