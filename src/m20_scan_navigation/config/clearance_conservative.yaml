scan_planner_node:
  ros__parameters:
    # Keep SCAN planning identical to the vendored project.  The independent
    # command guard below owns the additional 0.05 m execution margin.
    grid_map.double_cylinder_radius: 0.25
    optimization.dist0: 0.20

m20_grid_route_planner:
  ros__parameters:
    inflation_radius: 0.45

m20_collision_guard:
  ros__parameters:
    footprint_radius: 0.25
    footprint_offset: 0.18
    safety_margin: 0.05
    # The measured worst MuJoCo stop travel is 0.156 m. At the 0.45 m/s
    # command limit this 0.70 s horizon still previews 0.315 m, while
    # avoiding the one-second constant-turn extrapolation deadlock around
    # isolated obstacle corners.
    lookahead_sec: 0.70
