rslidar_pointcloud_to_scan:
  ros__parameters:
    use_sim_time: true

    # 为空时不做 TF 变换，直接沿用点云消息自身 frame。
    # 上真机接入 Nav2 时，如果已经有雷达坐标系到 base_link 的 TF，可以改成 base_link。
    target_frame: ""
    transform_tolerance: 0.01

    # 背部 3D 雷达转 2D 激光的核心参数：只取一定高度范围内的点。
    # 这个范围需要按雷达安装高度、俯仰角、地面点噪声继续实测调整。
    min_height: -0.30
    max_height: 0.30

    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.0034906585
    scan_time: 0.10

    range_min: 0.20
    range_max: 30.0
    use_inf: true
