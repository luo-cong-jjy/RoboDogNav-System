schema_version: 1

# Deployment metadata and interface contract for the back-mounted x86 host.
# This file documents the selected adapters; the site/floor geometry remains
# in a separate system_config so a real map is never confused with a test map.
host:
  architecture: x86_64
  operating_system: ubuntu_20.04
  ros_distribution: foxy
  build_from_clean_source: true

message_interfaces:
  source_directory: deep-robotics-msg
  expected_ros_package: drdds
  version: 1.1.0
  source_revision: aa646c1782aa982f384b7e46469723f31696f778
  status: synchronized_and_source_validated

localization:
  backend: elevator_lio
  package: lio
  config_path: root_config_m20_navigation_relocation.yaml
  input_topics:
    front_cloud: /rslidar_points_front
    rear_cloud: /rslidar_points_rear
    imu: /IMU
  output_topics:
    lio_body_odometry: /LIO/odom_vehicle
    lio_sensor_odometry: /LIO/odom_imu
    world_cloud: /LIO/clouds_lidar
    in_elevator: /LIO/in_elevator
    elevator_state: /LIO/elevator_state
  frames:
    # Keep LIO isolated from the M20 boot-time map -> base_link publisher.
    lio_world: lio_world
    lio_body: lio_base_link
    lio_imu: lio_imu
  navigation_adapter:
    # Message-only aliases; this adapter never publishes TF.
    input_world_frame: lio_world
    input_body_frame: lio_base_link
    output_world_frame: world
    output_body_frame: base_link
    output_odometry: /m20/localization/body_pose
    output_sensor_odometry: /m20/localization/sensor_pose
    output_world_cloud: /m20/localization/cloud
    measured_twist: /m20/locomotion/measured_twist
    measured_twist_timeout_sec: 0.50

navigation:
  planner: scan_planner
  body_pose_topic: /m20/localization/body_pose
  cloud_topic: /m20/localization/cloud
  sensor_pose_topic: /m20/localization/sensor_pose
  cloud_is_world: true
  local_pcd_raycaster: false

motion:
  common_input: /m20/locomotion/cmd_vel_sdk
  selected_factory_transport: basic_server
  robot_host: 10.21.31.103
  direct_ros:
    enabled: true
    readiness: source_abi_and_recorded_target_topics_validated
    command_topic: /NAV_CMD
    feedback_topic: /MOTION_INFO
    state_topic: /MOTION_STATE
    gait_topic: /GAIT
    hard_estop_topic: /HES_STATUS
    motion_qos: reliable_volatile
    hard_estop_qos: reliable_transient_local
    command_rate_hz: 20.0
    firmware_minimum: V1.1.7
    rmw: rmw_fastrtps_cpp
    required_messages:
      - drdds/msg/NavCmd
      - drdds/msg/MotionInfo
      - drdds/msg/MotionState
      - drdds/msg/Gait
      - drdds/msg/StdMsgInt32

floor_transfer:
  # Elevator-LIO provides elevator-state estimation, not elevator calling,
  # floor identity, or autonomous cabin-entry ownership.
  recommended_adapter: external_action
  first_hardware_stage: supervised_manual_transport
  recommended_pose_handoff: wait_for_target
  lio_set_pose_service_available: false

simulation_only_components:
  - m20_mujoco_backend
  - local_sensing_node_pcd_raycaster
  - m20_sdk_deploy_local_onnx_policy
  - joints_cmd_simulation_transport
