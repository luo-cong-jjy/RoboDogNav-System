schema_version: 1

system:
  project_id: m20_warehouse_flat_multifloor
  robot_model: deep_robotics_m20
  default_profile: rviz_flat_regions
  logical_floor_count: 2

frames:
  # warehouse_overview 只用于同时显示两块平面区域，不参与实机定位。
  overview: warehouse_overview
  active_map: map
  odom: odom
  robot_base: base_link
  lidar: lidar_link

simulation:
  # RViz 近似方案：两块 40 m × 40 m 区域在 x=0 处相邻，不模拟楼梯或电梯运动。
  layout_mode: flat_connected_regions
  ground_z: 0.0
  floor_size_x: 40.0
  floor_size_y: 40.0
  inter_region_gap: 0.0
  prohibit_direct_region_crossing: false
  # 正常巡检仅在共享原点原地切换活动 PCD，严禁调用仿真位姿传送。
  teleport_on_floor_switch: false
  elevator_transition_delay_sec: 0.0

floor_switch:
  # 当前仿真方案：保持零速、原地切换 active PCD，不改变世界位姿。
  transfer_adapter: timed_hold
  pose_handoff: preserve
  transition_delay_sec: 0.0
  transfer_timeout_sec: 120.0
  external_action_name: /m20/floor_transfer/execute

map_generation:
  deterministic: true
  obstacle_count_per_floor: 180
  obstacle_height: 2.0
  surface_resolution: 0.10
  boundary_clearance: 1.0
  reserved_zone_clearance: 1.0
  # 保留已验证基线场景原有的障碍物分离参数。
  minimum_obstacle_spacing: 0.08

floors:
  F1:
    display_name: warehouse_floor_1
    source_seed: 127
    # 源地图使用 [-20, 20] x [-20, 20]；右边界落在共享原点 x=0。
    simulation_offset: [-20.0, 0.0, 0.0]
    overview_z: 0.0
    pcd_file: maps/floor_1/floor_1.pcd
    metadata_file: maps/floor_1/floor_1.json
    initial_pose: [-37.0, 0.0, 0.0]
    elevator_lobby_pose: [0.0, 0.0, 0.0]
    elevator_cabin_pose: [0.0, 0.0, 0.0]
    # 仅移除与 F2 相邻边上的门洞，其他围栏仍是规划和安全层的障碍。
    transition_gateway:
      edge: max_x
      center_y: 0.0
      width: 4.0
    reserved_zones:
      - name: initial_zone
        center: [-37.0, 0.0]
        size: [3.0, 3.0]
      - name: elevator_zone
        center: [-1.5, 0.0]
        size: [3.0, 4.0]
    inspection_points:
      - name: F1_A
        pose: [-30.0, -10.0, 0.0]
        dwell_sec: 1.0
      - name: F1_B
        pose: [-15.0, 10.0, 0.0]
        dwell_sec: 1.0

  F2:
    display_name: warehouse_floor_2
    # F2 复用 F1 的内部障碍布局；仅相邻侧围栏门洞方向不同。
    replica_of: F1
    source_seed: 127
    # 左边界同样落在共享原点 x=0，两场景启动时同时可见。
    simulation_offset: [20.0, 0.0, 0.0]
    overview_z: 0.0
    pcd_file: maps/floor_2/floor_2.pcd
    metadata_file: maps/floor_2/floor_2.json
    initial_pose: [3.0, 0.0, 0.0]
    elevator_lobby_pose: [0.0, 0.0, 0.0]
    elevator_cabin_pose: [0.0, 0.0, 0.0]
    transition_gateway:
      edge: min_x
      center_y: 0.0
      width: 4.0
    reserved_zones:
      - name: elevator_zone
        center: [1.5, 0.0]
        size: [3.0, 4.0]
      - name: terminal_zone
        center: [3.0, 0.0]
        size: [3.0, 3.0]
    inspection_points:
      - name: F2_A
        # 与 F1_A 具有相同 floor-local 坐标 (-10, -10)。
        pose: [10.0, -10.0, 0.0]
        dwell_sec: 1.0
      - name: F2_B
        # 与 F1_B 具有相同 floor-local 坐标 (5, 10)。
        pose: [25.0, 10.0, 0.0]
        dwell_sec: 1.0

elevators:
  E1:
    # 共享门洞中心是逻辑切层点；每个方向均显式配置。
    trigger_tolerance_xy: 0.35
    trigger_tolerance_yaw: 3.141592653589793
    transitions:
      - from: F1
        to: F2
        source_trigger_pose: [0.0, 0.0, 0.0]
        target_release_pose: [0.0, 0.0, 0.0]
      - from: F2
        to: F1
        source_trigger_pose: [0.0, 0.0, 0.0]
        target_release_pose: [0.0, 0.0, 0.0]

map_switch_transaction:
  require_robot_stopped: true
  stop_linear_threshold: 0.03
  stop_angular_threshold: 0.05
  cancel_navigation_timeout_sec: 2.0
  reset_navigation_timeout_sec: 2.0
  load_map_timeout_sec: 5.0
  relocate_timeout_sec: 2.0
  readiness_timeout_sec: 5.0
  minimum_fresh_local_cloud_count: 3
  failure_state: FAULT_HOLD

navigation:
  # Manual/diagnostic goals keep the native SCAN target -> B-spline chain.
  # Manual and automatic goals share the vendored SCAN first-scene chain.
  global_route_backend: scan_native
  automatic_mission_route_backend: scan_native
  local_planner_backend: scan_planner
  scan_navigation_mode: 1
  local_cloud_topic: /quad_0/cloud
  sensor_cloud_topic: /quad_0/sensor_cloud
  goal_topic: /move_base_simple/goal
  raw_cmd_vel_topic: /m20/navigation/cmd_vel_raw
  goal_position_tolerance: 0.20
  goal_yaw_tolerance: 0.35

safety:
  manual_priority: true
  immediate_zero_on_emergency_stop: true
  immediate_zero_on_floor_switch_hold: true
  navigation_command_timeout_sec: 0.5
  max_linear_x: 0.45
  max_linear_y: 0.20
  max_angular_z: 0.65
  max_linear_accel: 1.0
  max_angular_accel: 1.2

mission:
  id: two_floor_warehouse_demo
  loop: false
  sequence:
    - type: inspection
      floor: F1
      point: F1_A
    - type: inspection
      floor: F1
      point: F1_B
    - type: floor_transfer
      connector: E1
      from: F1
      to: F2
    - type: inspection
      floor: F2
      point: F2_A
    - type: inspection
      floor: F2
      point: F2_B
    # 返回时经已验证的 A-B 走廊，不增加驻留，也不改变障碍物布局。
    - type: transit
      floor: F2
      point: F2_A
      name: F2_RETURN_VIA_A
    # 第二场景完整覆盖后回到进入 F2 时的共享原点。
    - type: terminal
      floor: F2
      location: elevator_lobby
      name: F2_TERMINAL
