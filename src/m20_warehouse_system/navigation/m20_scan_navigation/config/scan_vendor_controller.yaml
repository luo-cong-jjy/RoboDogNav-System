/**:
  ros__parameters:
    use_sim_time: false

    # Exact closed-loop values from the vendored SCAN-Planner scene.
    time_forward: 0.8
    heading_error_threshold: 0.8
    kp_pos: 0.8
    kp_yaw: 1.5
    max_vx: 0.75
    max_vy: 0.35
    max_vyaw: 1.0
    finish_dist: 0.15
    execution_hold_topic: /m20/control/execution_hold
    # Standalone/default SCAN preserves upstream trajectory-clock semantics.
    # The optional m20_safe integration profile overrides this to true.
    require_external_execution_hold: false
