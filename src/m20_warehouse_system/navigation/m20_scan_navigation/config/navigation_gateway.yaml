# =============================================================================
# navigation_gateway.yaml —— m20_navigation_gateway 网关节点参数
# 所属模块：m20_scan_navigation / config
# 用途：导航网关（类型化 NavigateFloor action + 受管 RViz 目标）的完整参数。
#       各键与 navigation_gateway_node.py 中 declare_parameter 一一对应。
# =============================================================================
m20_navigation_gateway:       # 网关节点名
  ros__parameters:
    action_name: /m20/navigation/navigate   # 类型化导航 action 服务器名
    default_timeout_sec: 120.0              # 默认导航超时（秒）
    feedback_period_sec: 0.20               # 反馈周期（秒）
    position_tolerance: 0.20                # 到点位置容差（米）
    # Absorb the DDS delivery race between the switch Action result and the
    # reliable hold=False sample received by this gateway.
    # （吸收楼层切换 Action 结果与本网关收到的可靠 hold=False 采样之间的
    #   DDS 投递竞态。）
    floor_hold_release_timeout_sec: 2.0     # 楼层保持释放等待超时（秒）
    # SCAN reset shares its upstream single-threaded executor with mapping.
    # Keep a bounded margin for one in-flight map/visualization callback.
    # （SCAN 复位与建图共享上游单线程执行器；为一个进行中的地图/可视化
    #   回调保留有界裕量。）
    navigation_reset_timeout_sec: 10.0      # SCAN 复位服务超时（秒）
    # m20_safe requires the independent point-cloud guard and fails closed
    # until it publishes CLEAR. scan_native overrides this to false because
    # that profile intentionally contains only SCAN's own collision model.
    # （m20_safe 要求独立点云守卫并在其发布 CLEAR 前"关闭即禁行"；
    #   scan_native 档把它覆盖为 false，因为该档刻意只含 SCAN 自身的碰撞
    #   模型。）
    collision_guard_required: true          # 是否要求碰撞守卫（fail-closed）
    # Recovery is allowed to move only within its own hard time/distance
    # budget. If that budget is spent, or no collision-checked rolling escape
    # exists, stop the old trajectory, wait for the guard to rearm, and ask
    # unchanged native SCAN to plan again. The hard per-goal count prevents
    # replanning from becoming an unbounded fallback.
    # （恢复行为只允许在自己的硬时间/距离预算内移动；若预算耗尽或不存在
    #   经碰撞检查的滚动逃生路径，则停止旧轨迹、等待守卫重新就绪、让未改
    #   动的原生 SCAN 重新规划。单目标硬次数上限防止重规划变成无界兜底。）
    collision_replan_enabled: true          # 是否启用碰撞重规划
    collision_replan_max_attempts: 2        # 单目标内重规划次数上限
    collision_replan_rearm_timeout_sec: 5.0 # 重规划前守卫重就绪等待超时（秒）
    collision_stop_topic: /m20/control/collision_stop                  # 碰撞停车标志话题
    collision_diagnostic_topic: /m20/control/collision_guard_diagnostic  # 碰撞守卫诊断话题
    # This is the only goal output. No stored 2D map or external A* route is
    # present in the runtime chain.
    # （这是唯一的目标输出；运行时链路中不存在存储的 2D 地图或外部 A* 路线。）
    direct_goal_topic: /move_base_simple/goal   # 发给原生 SCAN 的目标话题
    # In the integrated launch, RViz publishes the public vendor topic while
    # this gateway can relay it to a private SCAN ingress. The launch remap
    # prevents the gateway from subscribing to its own output.
    # （集成 launch 中 RViz 发布公共厂商话题，本网关可把它转发到私有 SCAN
    #   入口；launch 的重映射避免网关订阅到自己的输出。）
    manual_goal_monitor_enabled: false      # 是否接管 RViz 手点目标
    manual_goal_topic: /move_base_simple/goal  # RViz 手点目标话题
    manual_state_topic: /m20/navigation/manual_state  # 手点导航状态话题
    manual_timeout_sec: 300.0               # 手点导航超时（秒）
    # SCAN consumes only target position and its controller follows the
    # B-spline tangent. Keep this contract explicit: a clicked quaternion is
    # not treated as a strict terminal-yaw command.
    # （SCAN 只消费目标位置，其控制器沿 B 样条切线方向行驶。明确此契约：
    #   手点消息里的四元数不会被当作严格的末端朝向指令。）
    terminal_orientation_mode: position_only   # 末端朝向模式：仅位置
    scan_reset_service: /m20/navigation/reset  # SCAN 复位服务名
