closed_loop_controller:
  ros__parameters:
    # M20 command envelope layered over the unchanged SCAN controller.
    max_vx: 0.45
    max_vy: 0.20
    max_vyaw: 0.65
    # Keep the time-parameterized reference close to measured M20 progress.
    trajectory_progress_sync: true
    projection_samples: 60
    max_time_ahead: 0.20
