[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m20-mujoco-rl-training"
version = "0.1.0"
description = "MuJoCo reinforcement learning training scaffold for Deep Robotics M20."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21",
  "mujoco>=3.0",
  "torch>=2.0",
  "onnx>=1.14",
  "tqdm>=4.64",
]

[tool.setuptools.packages.find]
include = ["m20_mujoco_rl*"]

