m20_collision_guard:
  ros__parameters:
    # SCAN publishes its non-inflated occupied voxels in the world frame.
    # The guard projects only the M20 body-height band into a short-lived,
    # robot-centred safety raster; no PGM/YAML map is loaded.
    occupancy_cloud_topic: /grid_map/occupancy
    expected_cloud_frame: world
    occupancy_cloud_timeout_sec: 0.75
    online_grid_resolution: 0.10
    online_grid_size: 16.0
    minimum_obstacle_z_from_body: -0.50
    maximum_obstacle_z_from_body: 0.70
    odom_topic: /m20/sim/body_pose
    command_topic: /m20/navigation/cmd_vel_candidate
    stop_topic: /m20/control/collision_stop
    state_topic: /m20/control/collision_guard_state
    diagnostic_topic: /m20/control/collision_guard_diagnostic
    recovery_available_topic: /m20/control/collision_recovery_available
    recovery_command_topic: /m20/control/collision_recovery_cmd
    occupied_threshold: 50

    # Production native-SCAN footprint validated with the official M20.
    # The 0.70 s horizon previews 0.315 m at 0.45 m/s, over twice the
    # measured 0.156 m worst stop travel, without the old corner deadlock.
    # The robust grid-route profile still overrides this with a 0.50 m
    # envelope through collision_guard.yaml.
    footprint_radius: 0.25
    footprint_offset: 0.18
    safety_margin: 0.05
    lookahead_sec: 0.70
    sample_period_sec: 0.05
    command_timeout_sec: 0.50
    publish_rate_hz: 20.0
    # Command, drift and bounded-recovery values are injected from the same
    # versioned M20 capability profile used by the locomotion adapter.
