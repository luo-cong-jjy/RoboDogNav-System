m20_collision_guard:
  ros__parameters:
    # Legacy filename retained for configuration compatibility. Runtime input
    # is SCAN's online occupied-voxel cloud, never a static OccupancyGrid.
    occupancy_cloud_topic: /grid_map/occupancy
    expected_cloud_frame: world
    occupancy_cloud_timeout_sec: 0.75
    online_grid_resolution: 0.10
    online_grid_size: 16.0
    minimum_obstacle_z_from_body: -0.50
    maximum_obstacle_z_from_body: 0.70
    odom_topic: /m20/sim/body_pose
    command_topic: /m20/navigation/cmd_vel_candidate
    stop_topic: /m20/control/collision_stop
    state_topic: /m20/control/collision_guard_state
    diagnostic_topic: /m20/control/collision_guard_diagnostic
    recovery_available_topic: /m20/control/collision_recovery_available
    recovery_command_topic: /m20/control/collision_recovery_cmd
    occupied_threshold: 50
    footprint_radius: 0.38
    footprint_offset: 0.18
    safety_margin: 0.12
    lookahead_sec: 1.00
    sample_period_sec: 0.05
    command_timeout_sec: 0.50
    publish_rate_hz: 20.0
    # Command, drift and bounded-recovery values come from the selected M20
    # capability profile. This file only defines the robust grid-route shape.
