pointcloud_roi_bridge:
  ros__parameters:
    input_topic: /LIDAR/POINTS
    output_topic: /m20/perception/obstacle_cloud

    # Keep AOS work bounded. Start conservative, then relax after measuring hz/CPU.
    max_rate_hz: 10.0
    stride: 1
    max_points: 30000

    # ROI is in the incoming cloud frame. Verify header.frame_id before real navigation.
    use_roi: true
    min_x: -4.0
    max_x: 6.0
    min_y: -3.0
    max_y: 3.0
    min_z: -0.6
    max_z: 1.8

    use_voxel: true
    voxel_size: 0.10

    # Leave empty to preserve the lidar cloud frame.
    output_frame: ""

    reliable_qos: true
    log_period_sec: 2.0
