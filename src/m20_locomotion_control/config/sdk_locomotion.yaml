m20_navigation_adapter:
  ros__parameters:
    input_topic: /m20/navigation/cmd_vel_raw
    output_topic: /m20/navigation/cmd_vel_candidate
    mode_topic: /m20/navigation/candidate_mode
    command_timeout_sec: 0.30
    max_forward: 0.45
    max_side: 0.20
    max_yaw: 0.65
    deadband_linear: 0.01
    deadband_yaw: 0.02
    lateral_threshold: 0.05
    turn_yaw_threshold: 0.25
    in_place_linear_threshold: 0.08
    turn_curvature_threshold: 1.20
    curvature_speed_floor: 0.05
    # High-curvature coordination is turn-first with only a 0.05 m/s crawl.
    # Large heading changes are already pure rotation in the SCAN controller.
    turn_max_forward: 0.05
    lateral_max_forward: 0.10
    suppress_side_in_cruise: true
    suppress_side_in_turn: true
    # Correct cross-track drift before the double-circle footprint reaches a
    # narrow-passage edge, while retaining a small straight-line deadband.
    course_yaw_gain: 1.20
    turn_course_enter: 0.25
    turn_course_exit: 0.08
    turn_yaw_exit: 0.20
    # Prevent SCAN replans from rapidly toggling wheel cruise/turn intent.
    turn_min_hold_sec: 0.50
    cruise_yaw_deadband: 0.02
    cruise_yaw_filter_time_constant: 0.12
    output_linear_accel: 1.0
    output_yaw_accel: 1.2

m20_locomotion_manager:
  ros__parameters:
    input_topic: /m20/control/cmd_vel_safe
    output_topic: /m20/locomotion/cmd_vel_sdk
    mode_topic: /m20/locomotion/mode
    backend_ready_topic: /m20/sim/backend_ready
    backend_fault_topic: /m20/sim/backend_fault
    safety_state_topic: /m20/control/safety_state
    require_backend_ready: false
    # Autonomous commands were already adapted before collision prediction.
    # Keep this final backend gate from applying the transformation twice.
    rolling_navigation_enabled: false
    allow_manual_lateral: true
    command_timeout_sec: 0.30
    max_forward: 0.45
    max_side: 0.20
    max_yaw: 0.65
    deadband_linear: 0.01
    deadband_yaw: 0.02
    lateral_threshold: 0.05
    turn_yaw_threshold: 0.25
    in_place_linear_threshold: 0.08
    turn_curvature_threshold: 1.20
    curvature_speed_floor: 0.05
    turn_max_forward: 0.05
    lateral_max_forward: 0.10
    suppress_side_in_cruise: true
    suppress_side_in_turn: true
    # Autonomous patrol is rolling-first: SCAN lateral tracking error becomes
    # a yaw correction, while explicit MANUAL lateral motion stays available.
    course_yaw_gain: 1.20
    turn_course_enter: 0.25
    turn_course_exit: 0.08
    turn_yaw_exit: 0.20
    turn_min_hold_sec: 0.50
    cruise_yaw_deadband: 0.02
    cruise_yaw_filter_time_constant: 0.12
    output_linear_accel: 1.0
    output_yaw_accel: 1.2

m20_cmd_vel_interface:
  ros__parameters:
    cmd_vel_topic: /m20/locomotion/cmd_vel_sdk
    auto_start: true
    standup_delay_sec: 3.3
    cmd_timeout_sec: 0.5
    max_forward: 0.45
    max_side: 0.20
    max_yaw: 0.65
    control_rate_hz: 50.0
    debug_print: false
