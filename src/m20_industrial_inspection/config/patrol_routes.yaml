# 第一版巡检路线使用动作序列，不依赖地图和 Nav2。
# 后续接入定位导航后，再扩展为 waypoint/action 模式。
patrol_manager_node:
  ros__parameters:
    route_name: demo_motion
    cmd_topic: /m20_inspection/cmd_vel_nav
    publish_rate_hz: 10.0
    start_immediately: true
    loop_route: false
    start_delay_sec: 1.0

    step_names:
      - forward
      - stop_after_forward
      - turn_left
      - final_stop
    step_durations_sec: [4.0, 1.0, 3.0, 1.0]
    step_linear_x: [0.15, 0.0, 0.0, 0.0]
    step_linear_y: [0.0, 0.0, 0.0, 0.0]
    step_angular_z: [0.0, 0.0, 0.25, 0.0]
