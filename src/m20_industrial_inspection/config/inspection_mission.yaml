# 巡检任务层配置。
# 当前阶段使用 /odom 作为全局坐标，后续可把目标下发接口替换为 Nav2 action 或局部规划器。
inspection_mission_node:
  ros__parameters:
    mission_name: odom_inspection_single_goal
    frame_id: odom
    target_goal_topic: /m20_inspection/tracker_goal
    rviz_goal_topic: /goal_pose
    mission_control_topic: /m20_inspection/mission_control
    tracker_control_topic: /m20_inspection/tracker_control
    tracker_status_topic: /m20_inspection/tracker_status
    mission_status_topic: /m20_inspection/mission_status
    mission_marker_topic: /m20_inspection/mission_route_marker

    publish_rate_hz: 5.0
    start_immediately: true
    start_delay_sec: 1.5
    loop_route: false
    goal_burst_count: 3
    default_dwell_sec: 1.0
    marker_scale: 0.14

    # 当前只保留第一个导航点；后续加点时保持数组长度一致即可。
    point_names: [front_test_goal]
    point_x: [0.0]
    point_y: [0.8]
    # point_yaw 留空表示当前阶段不强制最终朝向。
    point_dwell_sec: [1.0]
