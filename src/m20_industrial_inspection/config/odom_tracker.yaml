# 上层任务管理器使用的 odom 目标跟踪器配置。
# 它不自带巡检队列，只等待 /m20_inspection/tracker_goal 下发目标。
odom_waypoint_patrol_node:
  ros__parameters:
    route_name: odom_goal_tracker
    odom_topic: /odom
    cmd_topic: /m20_inspection/cmd_vel_nav
    status_topic: /m20_inspection/tracker_status
    goal_topic: /m20_inspection/current_goal
    goal_marker_topic: /m20_inspection/current_goal_marker
    route_marker_topic: /m20_inspection/route_marker
    odom_trace_topic: /m20_inspection/odom_trace
    goal_input_topic: /m20_inspection/tracker_goal
    control_topic: /m20_inspection/tracker_control
    enable_runtime_goal: true
    wait_for_runtime_goal: true
    runtime_goal_requires_yaw: false
    marker_frame_id: odom
    publish_rate_hz: 10.0
    start_delay_sec: 0.0
    loop_route: false

    goal_tolerance_m: 0.08
    yaw_tolerance_rad: 0.25
    dwell_time_sec: 0.8
    odom_timeout_sec: 0.5

    max_linear_speed: 0.35
    max_angular_speed: 0.55
    linear_gain: 0.7
    angular_gain: 1.2
    rotate_in_place_error_rad: 0.65
    tracking_mode: pure_pursuit
    pure_pursuit_lookahead_distance: 0.45
    pure_pursuit_min_linear_speed: 0.03
    pure_pursuit_slowdown_distance: 0.75
    pure_pursuit_curvature_gain: 1.0
    odom_trace_max_points: 600
    odom_trace_min_interval_m: 0.04
    odom_trace_z: 0.04
    goal_marker_scale: 0.18
    route_marker_scale: 0.08

    # 占位目标。wait_for_runtime_goal=true 时不会主动执行。
    waypoint_x: [0.0]
    waypoint_y: [0.0]
