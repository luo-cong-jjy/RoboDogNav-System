schema_version: 1
system:
  project_id: m20_narrow_passage_065
  robot_model: deep_robotics_m20
  default_profile: narrow_passage_065
  logical_floor_count: 2
frames:
  overview: warehouse_overview
  active_map: map
  odom: odom
  robot_base: base_link
  lidar: lidar_link
simulation:
  layout_mode: flat_connected_regions
  ground_z: 0.0
  floor_size_x: 20.0
  floor_size_y: 20.0
  inter_region_gap: 0.0
  prohibit_direct_region_crossing: false
  teleport_on_floor_switch: false
  elevator_transition_delay_sec: 0.0
map_generation:
  deterministic: true
  obstacle_count_per_floor: 2
  obstacle_height: 2.0
  surface_resolution: 0.05
  boundary_clearance: 0.5
  reserved_zone_clearance: 0.1
  minimum_obstacle_spacing: 0.1
floors:
  F1:
    display_name: narrow_065_scene_1
    source_seed: 127
    simulation_offset:
    - -10.0
    - 0.0
    - 0.0
    overview_z: 0.0
    pcd_file: maps/narrow_passage/width_065/scene_1/scene_1.pcd
    occupancy_file: maps/narrow_passage/width_065/scene_1/scene_1.yaml
    metadata_file: maps/narrow_passage/width_065/scene_1/scene_1.json
    initial_pose:
    - -18.0
    - 0.0
    - 0.0
    elevator_lobby_pose:
    - 0.0
    - 0.0
    - 0.0
    elevator_cabin_pose:
    - 0.0
    - 0.0
    - 0.0
    transition_gateway:
      edge: max_x
      center_y: 0.0
      width: 4.0
    reserved_zones:
    - name: benchmark_start
      center:
      - -18.0
      - 0.0
      size:
      - 2.0
      - 2.0
    - name: benchmark_finish
      center:
      - -7.0
      - 0.0
      size:
      - 2.0
      - 2.0
    - name: shared_gateway_zone
      center:
      - -1.0
      - 0.0
      size:
      - 2.0
      - 4.0
    fixed_obstacles:
    - name: doorway_upper_wall
      center:
      - -12.5
      - 4.9125
      size:
      - 1.0
      - 9.175
    - name: doorway_lower_wall
      center:
      - -12.5
      - -4.9125
      size:
      - 1.0
      - 9.175
    inspection_points:
    - name: F1_DOORWAY_EXIT
      pose:
      - -7.0
      - 0.0
      - 0.0
      dwell_sec: 0.2
  F2:
    display_name: narrow_065_scene_2
    replica_of: F1
    source_seed: 127
    simulation_offset:
    - 10.0
    - 0.0
    - 0.0
    overview_z: 0.0
    pcd_file: maps/narrow_passage/width_065/scene_2/scene_2.pcd
    occupancy_file: maps/narrow_passage/width_065/scene_2/scene_2.yaml
    metadata_file: maps/narrow_passage/width_065/scene_2/scene_2.json
    initial_pose:
    - 2.0
    - 0.0
    - 0.0
    elevator_lobby_pose:
    - 0.0
    - 0.0
    - 0.0
    elevator_cabin_pose:
    - 0.0
    - 0.0
    - 0.0
    transition_gateway:
      edge: min_x
      center_y: 0.0
      width: 4.0
    reserved_zones:
    - name: benchmark_start
      center:
      - 2.0
      - 0.0
      size:
      - 2.0
      - 2.0
    - name: benchmark_finish
      center:
      - 13.0
      - 0.0
      size:
      - 2.0
      - 2.0
    - name: shared_gateway_zone
      center:
      - 1.0
      - 0.0
      size:
      - 2.0
      - 4.0
    inspection_points:
    - name: F2_DOORWAY_EXIT
      pose:
      - 13.0
      - 0.0
      - 0.0
      dwell_sec: 0.2
elevators:
  E1:
    simulation_mode: continuous_origin_map_switch
    source_floor: F1
    target_floor: F2
    source_trigger_pose:
    - 0.0
    - 0.0
    - 0.0
    target_release_pose:
    - 0.0
    - 0.0
    - 0.0
    trigger_tolerance_xy: 0.35
    trigger_tolerance_yaw: 3.141592653589793
    reverse_transition_enabled: true
map_switch_transaction:
  require_robot_stopped: true
  stop_linear_threshold: 0.03
  stop_angular_threshold: 0.05
  cancel_navigation_timeout_sec: 2.0
  reset_navigation_timeout_sec: 2.0
  load_map_timeout_sec: 5.0
  relocate_timeout_sec: 2.0
  readiness_timeout_sec: 12.0
  minimum_fresh_local_cloud_count: 3
  failure_state: FAULT_HOLD
navigation:
  global_route_backend: scan_native
  automatic_mission_route_backend: scan_native
  optional_global_route_backend: grid_astar
  local_planner_backend: scan_planner
  scan_navigation_mode: 1
  local_cloud_topic: /quad_0/cloud
  sensor_cloud_topic: /quad_0/sensor_cloud
  goal_topic: /move_base_simple/goal
  routed_goal_topic: /m20/navigation/goal_pose
  global_route_topic: /m20/navigation/global_route
  scan_subgoal_topic: /move_base_simple/goal
  raw_cmd_vel_topic: /m20/navigation/cmd_vel_raw
  goal_position_tolerance: 0.2
  goal_yaw_tolerance: 0.35
safety:
  manual_priority: true
  immediate_zero_on_emergency_stop: true
  immediate_zero_on_floor_switch_hold: true
  navigation_command_timeout_sec: 0.5
  max_linear_x: 0.45
  max_linear_y: 0.2
  max_angular_z: 0.65
  max_linear_accel: 1.0
  max_angular_accel: 1.2
mission:
  id: narrow_passage_benchmark
  loop: false
  sequence:
  - type: inspection
    floor: F1
    point: F1_DOORWAY_EXIT
experiment:
  kind: narrow_passage_sweep
  controlled_variable: doorway_clear_width
  value_m: 0.65
  baseline: dense_four_corner_system.yaml
  map_resolution_m: 0.05
  robot_body_width_m: 0.51
