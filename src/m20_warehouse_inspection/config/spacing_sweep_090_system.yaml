schema_version: 1
system:
  project_id: m20_warehouse_spacing_090
  robot_model: deep_robotics_m20
  default_profile: rviz_spacing_090
  logical_floor_count: 2
frames:
  overview: warehouse_overview
  active_map: map
  odom: odom
  robot_base: base_link
  lidar: lidar_link
simulation:
  layout_mode: flat_connected_regions
  ground_z: 0.0
  floor_size_x: 40.0
  floor_size_y: 40.0
  inter_region_gap: 0.0
  prohibit_direct_region_crossing: false
  teleport_on_floor_switch: false
  elevator_transition_delay_sec: 0.0
map_generation:
  deterministic: true
  obstacle_count_per_floor: 252
  obstacle_height: 2.0
  surface_resolution: 0.1
  boundary_clearance: 1.0
  reserved_zone_clearance: 1.0
  minimum_obstacle_spacing: 0.9
floors:
  F1:
    display_name: spacing_090_scene_1
    source_seed: 127
    simulation_offset:
    - -20.0
    - 0.0
    - 0.0
    overview_z: 0.0
    pcd_file: maps/spacing_sweep/spacing_090/scene_1/scene_1.pcd
    occupancy_file: maps/spacing_sweep/spacing_090/scene_1/scene_1.yaml
    metadata_file: maps/spacing_sweep/spacing_090/scene_1/scene_1.json
    initial_pose:
    - -37.0
    - 0.0
    - 0.0
    elevator_lobby_pose:
    - 0.0
    - 0.0
    - 0.0
    elevator_cabin_pose:
    - 0.0
    - 0.0
    - 0.0
    transition_gateway:
      edge: max_x
      center_y: 0.0
      width: 4.0
    reserved_zones:
    - name: mission_start_zone
      center:
      - -37.0
      - 0.0
      size:
      - 3.0
      - 3.0
    - name: shared_gateway_zone
      center:
      - -1.5
      - 0.0
      size:
      - 3.0
      - 4.0
    fixed_obstacles:
    - name: inbound_left_pallet
      center:
      - -38.35
      - -7.7
      size:
      - 0.8
      - 1.1
    - name: left_descent_case
      center:
      - -36.5
      - -7.7
      size:
      - 0.8
      - 1.1
    - name: bottom_west_crate
      center:
      - -28.5
      - -16.0
      size:
      - 1.2
      - 0.8
    - name: bottom_east_rack
      center:
      - -15.8
      - -16.0
      size:
      - 0.8
      - 1.3
    - name: right_lower_pallet
      center:
      - -4.0
      - -8.5
      size:
      - 0.8
      - 1.2
    - name: right_upper_case
      center:
      - -4.0
      - 5.5
      size:
      - 1.1
      - 0.8
    - name: top_east_crate
      center:
      - -12.5
      - 16.0
      size:
      - 1.3
      - 0.8
    - name: top_west_rack
      center:
      - -25.0
      - 16.0
      size:
      - 0.8
      - 1.1
    - name: outbound_diagonal_west
      center:
      - -23.4
      - 10.4
      size:
      - 1.0
      - 1.0
    - name: outbound_diagonal_east
      center:
      - -10.8
      - 4.8
      size:
      - 1.2
      - 0.8
    - name: home_aisle_east
      center:
      - -9.0
      - 0.0
      size:
      - 1.3
      - 0.8
    - name: home_aisle_west
      center:
      - -23.0
      - 0.0
      size:
      - 0.9
      - 1.2
    inspection_points:
    - name: F1_LOWER_LEFT
      pose:
      - -36.0
      - -16.0
