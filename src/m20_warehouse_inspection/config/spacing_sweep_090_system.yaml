      dwell_sec: 1.0
    - name: F1_UPPER_RIGHT
      pose:
      - -4.0
      - 16.0
      - 0.0
      dwell_sec: 1.0
    - name: F1_UPPER_LEFT
      pose:
      - -36.0
      - 16.0
      - 0.0
      dwell_sec: 1.0
  F2:
    display_name: spacing_090_scene_2
    replica_of: F1
    source_seed: 127
    simulation_offset:
    - 20.0
    - 0.0
    - 0.0
    overview_z: 0.0
    pcd_file: maps/spacing_sweep/spacing_090/scene_2/scene_2.pcd
    occupancy_file: maps/spacing_sweep/spacing_090/scene_2/scene_2.yaml
    metadata_file: maps/spacing_sweep/spacing_090/scene_2/scene_2.json
    initial_pose:
    - 3.0
    - 0.0
    - 0.0
    elevator_lobby_pose:
    - 0.0
    - 0.0
    - 0.0
    elevator_cabin_pose:
    - 0.0
    - 0.0
    - 0.0
    transition_gateway:
      edge: min_x
      center_y: 0.0
      width: 4.0
    reserved_zones:
    - name: shared_gateway_zone
      center:
