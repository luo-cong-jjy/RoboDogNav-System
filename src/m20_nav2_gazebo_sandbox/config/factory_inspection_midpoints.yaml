factory_inspection_nav2_mission:
  ros__parameters:
    use_sim_time: true
    mission_name: factory_snake_midpoints
    action_name: navigate_to_pose
    frame_id: map

    status_topic: /m20_factory_inspection/status
    route_marker_topic: /m20_factory_inspection/route_marker
    current_goal_topic: /m20_factory_inspection/current_goal
    current_goal_marker_topic: /m20_factory_inspection/current_goal_marker

    start_immediately: true
    start_delay_sec: 3.0
    start_index: 1
    loop_route: false
    default_dwell_sec: 1.0
    goal_timeout_sec: 180.0
    continue_on_failure: false
    publish_rate_hz: 2.0

    # 巡检点策略 v1：取建图蛇形路线每一段中点。
    # 原始路线：
    # (0.0)->(20.0)->(20.4)->(0.4)->(0.8)->(20.8)
    # ->(20.12)->(0.12)->(0.16)->(20.16)->(20.20)->(0.20)
    point_names:
      - start_home              # (0,0)    ★起点
      - aisle_00_start          # (10,0)   路径起点
      - east_corner_00          # (20,0)   东南角转弯
      - east_corner_04          # (20,4)   东侧转弯
      - inspect_x10_y04         # (10,4)   ★巡检点
      - west_corner_04          # (0,4)    西侧转弯
      - west_corner_08          # (0,8)    西侧转弯
      - inspect_x10_y08         # (10,8)   ★巡检点
      - east_corner_08          # (20,8)   东侧转弯
      - east_corner_12          # (20,12)  东侧转弯
      - inspect_x10_y12         # (10,12)  ★巡检点
      - west_corner_12          # (0,12)   西侧转弯
      - west_corner_16          # (0,16)   西侧转弯
      - inspect_x10_y16         # (10,16)  ★巡检点
      - east_corner_16          # (20,16)  东侧转弯
      - east_corner_20          # (20,20)  东北角转弯
      - inspect_x10_y20         # (10,20)  ★巡检点
      - west_corner_20          # (0,20)   西北角转弯
      - return_home             # (0,0)    返回原点
    point_x:         [    0.0,   10.0,   20.0,   20.0,   10.0,    0.0,    0.0,   10.0,   20.0,    20.0,   10.0,    0.0,    0.0,   10.0,   20.0,   20.0,   10.0,    0.0,    0.0]
    point_y:         [    0.0,    0.0,    0.0,    4.0,    4.0,    4.0,    8.0,    8.0,    8.0,    12.0,   12.0,   12.0,   16.0,   16.0,   16.0,   20.0,   20.0,   20.0,    0.0]
    point_yaw:       [    0.0,    0.0, 1.5708, 3.1416, 3.1416, 1.5708,    0.0,    0.0, 1.5708,  3.1416, 3.1416, 1.5708,    0.0,    0.0, 1.5708, 3.1416, 3.1416,-1.5708,-1.5708]
    point_dwell_sec: [    5.0,    2.0,    0.5,    0.5,    2.0,    0.5,    0.5,    2.0,    0.5,     0.5,    2.0,    0.5,    0.5,    2.0,    0.5,    0.5,    2.0,    0.5,  100.0]
